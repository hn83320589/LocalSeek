name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Uno.Sdk adds the DevServer package for Debug restores, which refuses optimized builds,
      # so restore must already use the Release configuration.
      - name: Restore
        run: dotnet restore LocalSeek.sln -p:Configuration=Release

      - name: Build
        run: dotnet build LocalSeek.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/LocalSeek.Tests/LocalSeek.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

      - name: Publish win-x64
        run: dotnet publish src/LocalSeek.App/LocalSeek.App.csproj -c Release -f net9.0-windows10.0.19041 -r win-x64 -p:PublishProfile=win-x64 -o artifacts/publish/win-x64

      - name: Upload win-x64 publish
        uses: actions/upload-artifact@v4
        with:
          name: LocalSeek-win-x64
          path: artifacts/publish/win-x64
